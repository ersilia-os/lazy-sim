[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-sim"
version = "0.1.0"
description = "Fast similarity search in large chemical libraries, by the Ersilia Open Source Initiative"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name="Ersilia Open Source Initiative", email="hello@ersilia.io"}
]
requires-python = ">=3.12"

dependencies = [
  "click==8.5.0",
  "numpy==2.5.3",
  "rdkit==2026.3.6",
  "rich==15.0.0",
  "turbovec==1.1.2",
]

[project.urls]
Homepage = "https://github.com/ersilia-os/lazy-sim"
Ersilia = "https://ersilia.io"

[project.optional-dependencies]
ecfp = [
  "FPSim2==0.7.4",
]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.13",
]

[project.scripts]
lazysim = "lazy_sim.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lazy_sim = ["results/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
